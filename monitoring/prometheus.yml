# Сбор метрик раз в 30 секунд. Хранение — 15 дней или 500 МБ, что раньше:
# сервер маленький, мониторинг не должен съедать память и диск сайтов.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: ops
    static_configs: [{ targets: ["ops-worker:9108"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
