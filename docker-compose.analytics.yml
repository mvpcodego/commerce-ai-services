# ClickHouse для аналитики продаж (services/ops/ops/analytics.py). Для разработки:
#   docker compose -f docker-compose.analytics.yml up -d     → HTTP :8123
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: tmgoods-clickhouse
    env_file: .env.analytics
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 1g

volumes:
  clickhouse-data:
