[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Адрес базы берётся из OPS_DATABASE_URL (см. migrations/env.py), здесь его нет.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
