[project]
name = "ops"
version = "0.1.0"
description = "Фоновые задачи TMGoods: очередь на Postgres, закупки, выгрузки, сводки"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "prometheus-client>=0.21",
  "celery>=5.4",
  "aiokafka>=0.14.0",
  "clickhouse-connect>=1.10.0",
  "grpcio>=1.84.0",
  "protobuf>=7.36.2",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
