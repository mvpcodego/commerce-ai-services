[project]
name = "procurement-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.166",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
