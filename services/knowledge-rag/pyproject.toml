[project]
name = "knowledge-rag"
version = "0.1.0"
description = "RAG по базе знаний магазина автомагнитол: pgvector + полнотекст, RRF, ответы с цитатами"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
